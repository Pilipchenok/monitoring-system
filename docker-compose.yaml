version: "3.8"

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      - collector

  postgres:
    image: postgres:16-alpine
    container_name: docker-postgres-monitoring
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: monitoring
    ports:
      - "5433:5432"
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
