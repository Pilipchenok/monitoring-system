<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }
        
        .chart-wrapper {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        h2 { text-align: center; color: #555; font-size: 1.2em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Мониторинг сервера (Live)</h1>
        
        <div class="charts-grid">
            <div>
                <h2>Загрузка ресурсов (%)</h2>
                <div class="chart-wrapper">
                    <canvas id="resourcesChart"></canvas>
                </div>
            </div>

            <div>
                <h2>Сетевая активность (Кол-во соединений)</h2>
                <div class="chart-wrapper">
                    <canvas id="connectionsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const commonOptions = {
            animation: false,
            elements: { point: { radius: 0 } },
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.dataset.label + ': ' + context.parsed.y.toFixed(1);
                        }
                    }
                }
            }
        };

        const ctxRes = document.getElementById('resourcesChart').getContext('2d');
        const resourcesChart = new Chart(ctxRes, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'CPU (%)',
                        data: [],
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 2, tension: 0.3, fill: true
                    },
                    {
                        label: 'RAM (%)',
                        data: [],
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderWidth: 2, tension: 0.3, fill: true
                    },
                    {
                        label: 'DISK (%)',
                        data: [],
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderWidth: 2, tension: 0.3, fill: true
                    }
                ]
            },
            options: {
                ...commonOptions,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 0.5 } }
                }
            }
        });

        const ctxConn = document.getElementById('connectionsChart').getContext('2d');
        const connectionsChart = new Chart(ctxConn, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Active Connections',
                        data: [],
                        borderColor: 'rgba(255, 206, 86, 1)',
                        backgroundColor: 'rgba(255, 206, 86, 0.2)',
                        borderWidth: 2, tension: 0.3, fill: true
                    }
                ]
            },
            options: {
                ...commonOptions,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0
                        }
                    } 
                }
            }
        });

        const MAX_DATA_POINTS = 20;

        async function fetchMetrics() {
            try {
                const response = await fetch('/api/metrics/latest');
                if (!response.ok) throw new Error('Ошибка сети');
                
                const data = await response.json();
                const now = new Date().toLocaleTimeString();

                resourcesChart.data.labels.push(now);
                connectionsChart.data.labels.push(now);

                let currentCPU = 0, currentRAM = 0, currentDisk = 0, currentConn = 0;

                data.forEach(item => {
                    const name = (item.Name || item.name).toLowerCase();
                    const value = item.Value || item.value;
                    
                    if (name === 'cpu') currentCPU = value;
                    if (name === 'ram') currentRAM = value;
                    if (name === 'disk') currentDisk = value;
                    if (name === 'activeconnections') currentConn = value;
                });

                resourcesChart.data.datasets[0].data.push(currentCPU);
                resourcesChart.data.datasets[1].data.push(currentRAM);
                resourcesChart.data.datasets[2].data.push(currentDisk);

                connectionsChart.data.datasets[0].data.push(currentConn);

                if (resourcesChart.data.labels.length > MAX_DATA_POINTS) {
                    resourcesChart.data.labels.shift();
                    resourcesChart.data.datasets[0].data.shift();
                    resourcesChart.data.datasets[1].data.shift();
                    resourcesChart.data.datasets[2].data.shift();
                }

                if (connectionsChart.data.labels.length > MAX_DATA_POINTS) {
                    connectionsChart.data.labels.shift();
                    connectionsChart.data.datasets[0].data.shift();
                }

                resourcesChart.update();
                connectionsChart.update();
            } catch (error) {
                console.error('Ошибка при получении метрик:', error);
            }
        }

        fetchMetrics();
        setInterval(fetchMetrics, 2000);
    </script>
</body>
</html>
